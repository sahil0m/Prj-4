name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shared package must be built first: server and client both
      # consume its emitted type declarations.
      - name: Build shared package
        run: npm run build -w shared

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build everything
        run: npm run build

      # A bloated participant bundle is a product failure, not a nit: the
      # join page has to open in under a second on conference wifi.
      - name: Enforce participant bundle budget
        run: node scripts/check-bundle-size.mjs
        if: hashFiles('join/dist/**') != ''

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Fail only on high and critical. Moderate advisories in dev-only
      # dependencies should not block a deploy.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
