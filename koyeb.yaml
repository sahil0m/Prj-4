# The server, on Koyeb.
#
# Koyeb rather than the other free hosts because its free instance is not
# stopped when idle and it does not ask for a card to sign up. A response
# system is opened minutes before a lecture and has to answer at once; a
# cold start while a hall waits is worse than it sounds.
#
# This file documents the settings. The dashboard at app.koyeb.com is the
# easier way to apply them, and DEPLOYING.md walks through it.

app: pulse
services:
  - name: server
    type: web

    git:
      repository: github.com/sahil0m/Prj-4
      branch: main
      # Built from the Dockerfile at the repository root, which produces
      # the server alone. The two browser applications are static files
      # and are served from Vercel.
      builder: docker
      dockerfile: Dockerfile

    instance_type: free

    # One instance, and only one. Socket.IO rooms and the broadcast
    # scheduling live in that process's memory, so a second instance
    # would hold half the room and neither half would see the other's
    # answers. Raising this needs a shared adapter first; one instance
    # already carried 1,500 simultaneous phones in testing.
    scaling:
      min: 1
      max: 1

    ports:
      - port: 8000
        protocol: http

    routes:
      - path: /
        port: 8000

    health_checks:
      - path: /health/ready
        port: 8000
        protocol: http
        grace_period: 30
        interval: 30
        timeout: 5

    env:
      - key: NODE_ENV
        value: production
      # Koyeb routes to 8000 by default; the server reads this.
      - key: PORT
        value: '8000'
      # The clients are served from another domain, so every API call is
      # cross-site and the sign-in cookie has to be marked as such.
      - key: CROSS_SITE_COOKIES
        value: 'true'

      # The rest are secrets, set in the dashboard rather than here:
      #   DATABASE_URL            the Neon connection string
      #   AUTH_SECRET             openssl rand -base64 48
      #   PRESENTER_TOKEN_SECRET  openssl rand -base64 48
      #   CLIENT_ORIGIN           the presenter app's Vercel URL
      #   JOIN_ORIGIN             the audience app's Vercel URL
      #   SERVER_ORIGIN           this service's own Koyeb URL
