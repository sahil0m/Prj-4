# The server, on Fly.io.
#
# Chosen over the other free hosts because the machine is not stopped
# when it goes idle. A response system is opened minutes before a
# lecture and has to answer immediately; a fifty-second cold start while
# a hall waits is worse than it sounds.
#
# Change `app` to the name you register, then:
#   fly launch --no-deploy      (once, to create the app)
#   fly secrets set DATABASE_URL=... AUTH_SECRET=... PRESENTER_TOKEN_SECRET=...
#   fly deploy

app = "pulse-server"
primary_region = "bom"          # Mumbai; use the region nearest the room

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # The clients are served from elsewhere, so every API call is
  # cross-site and the refresh cookie needs saying so explicitly.
  CROSS_SITE_COOKIES = "true"

[http_service]
  internal_port = 4000
  force_https = true

  # Not stopped when idle. The free allowance covers one machine of this
  # size running continuously.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # One machine, and only one. Socket.IO rooms and the broadcast
  # scheduling live in that process's memory, so a second machine would
  # hold half the room and neither would see the other's answers. Raising
  # this needs a shared adapter first.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
